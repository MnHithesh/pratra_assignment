<div class="container">
  <section class="hero">
    <div class="intro">
      @if (user(); as u) {
        <p class="eyebrow">Welcome back, {{ u.name.split(' ')[0] }}</p>
      }
      <h1>Where are you flying next?</h1>
      <p class="lead">Compare fares from IndiGo, Air India, Akasa, Emirates and more, then book in a couple of minutes.</p>
    </div>

    <div class="search-card">
      <app-flight-search-form (search)="onSearch($event)" />
    </div>

    <div class="popular">
      <span class="popular-label">Popular:</span>
      <ul>
        @for (route of popularRoutes; track route.from + route.to) {
          <li>
            <button type="button" (click)="searchRoute(route)" [title]="route.fromCity + ' to ' + route.toCity + ', a week from today'">
              {{ route.from }} <mat-icon>arrow_forward</mat-icon> {{ route.to }}
            </button>
          </li>
        }
      </ul>
    </div>
  </section>
</div>
